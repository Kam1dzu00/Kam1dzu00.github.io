<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RBAC Console — Demo</title><style>*{box-sizing:border-box}body{margin:0;background:#0a0b0e;color:#f4f5f6;font:14px/1.5 Inter,system-ui}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.back{color:#9ca7b2}.card{border:1px solid #2b313a;background:#11141a;border-radius:20px;padding:17px}.grid{display:grid;grid-template-columns:340px 1fr;gap:14px;margin-top:20px}.user{padding:12px;border-radius:13px;border:1px solid transparent;cursor:pointer;display:flex;justify-content:space-between;gap:10px}.user:hover,.user.on{background:#181d24;border-color:#343d47}.user small{display:block;color:#7e8995}.role{color:#d9ff3f;font-size:11px}.matrix{overflow:auto}.matrix table{width:100%;border-collapse:collapse;min-width:620px}.matrix th,.matrix td{padding:12px;border-bottom:1px solid #252d35;text-align:left}.toggle{width:40px;height:23px;background:#303945;border-radius:99px;position:relative;cursor:pointer}.toggle:after{content:"";position:absolute;width:17px;height:17px;border-radius:50%;background:#9aa5b0;top:3px;left:3px;transition:.2s}.toggle.on{background:#d9ff3f}.toggle.on:after{left:20px;background:#101306}.audit{margin-top:14px}.log{display:grid;grid-template-columns:110px 1fr 110px;gap:10px;padding:10px 0;border-bottom:1px solid #252d35}.muted{color:#7f8a96}.save{border:0;background:#d9ff3f;color:#090b0c;padding:10px 14px;border-radius:11px;font-weight:900;cursor:pointer}.toast{position:fixed;right:20px;bottom:20px;background:#d9ff3f;color:#08100a;padding:11px 14px;border-radius:12px;font-weight:900;transform:translateY(100px);transition:.3s}.toast.on{transform:none}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:14px}.log{grid-template-columns:80px 1fr}.log span:last-child{display:none}}</style></head><body><div class="wrap"><div class="top"><div><a class="back" href="../">← portfolio</a><h1>Auth / RBAC Console</h1><div class="muted">portfolio demo · roles, permissions, audit</div></div><button class="save" id="save">Save changes</button></div><div class="grid"><aside class="card"><h3>Users</h3><div id="users"></div></aside><section><div class="card"><h3 id="title">Permissions</h3><div class="matrix"><table><thead><tr><th>Resource</th><th>Read</th><th>Create</th><th>Update</th><th>Delete</th></tr></thead><tbody id="matrix"></tbody></table></div></div><div class="card audit"><h3>Audit trail</h3><div id="audit"></div></div></section></div></div><div class="toast" id="toast">Permissions saved</div><script>const us=[['Anna Petrova','Product Ops','Admin'],['Mark Wilson','Support','Operator'],['Mia Chen','Finance','Analyst'],['Leo Adams','Engineering','Developer']];const resources=['Users','Documents','Reports','Integrations','Billing'];let current=0;function toggle(el){el.classList.toggle('on')}function renderUsers(){users.innerHTML=us.map((u,i)=>`<div class="user ${i===current?'on':''}" onclick="current=${i};renderUsers();renderMatrix()"><div><b>${u[0]}</b><small>${u[1]}</small></div><span class="role">${u[2]}</span></div>`).join('')}function renderMatrix(){title.textContent=`Permissions · ${us[current][0]}`;matrix.innerHTML=resources.map((r,i)=>`<tr><th>${r}</th>${[0,1,2,3].map((_,j)=>`<td><div class="toggle ${(current===0||j<2||(current===3&&i===3))?'on':''}" onclick="toggle(this)"></div></td>`).join('')}</tr>`).join('')}audit.innerHTML=[['12:42','Role changed: Operator → Admin','M. Fedrunov'],['11:18','Integration/Delete revoked','system'],['09:06','Login from new device','Anna Petrova']].map(x=>`<div class="log"><span class="muted">${x[0]}</span><b>${x[1]}</b><span class="muted">${x[2]}</span></div>`).join('');save.onclick=()=>{toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),1600)};renderUsers();renderMatrix();</script></body></html>

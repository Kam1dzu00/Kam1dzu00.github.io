<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RBAC Console — Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#0a0b0e;color:#f4f5f6;font:14px/1.5 Inter,system-ui}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.back{color:#9ca7b2;cursor:pointer}.top-actions{display:flex;gap:8px}.card{border:1px solid #2b313a;background:#11141a;border-radius:20px;padding:17px}.grid{display:grid;grid-template-columns:340px 1fr;gap:14px;margin-top:20px}.user{padding:12px;border-radius:13px;border:1px solid transparent;cursor:pointer;display:flex;justify-content:space-between;gap:10px}.user:hover,.user.on{background:#181d24;border-color:#343d47}.user small{display:block;color:#7e8995}.role{color:#d9ff3f;font-size:11px}.matrix{overflow:auto}.matrix table{width:100%;border-collapse:collapse;min-width:620px}.matrix th,.matrix td{padding:12px;border-bottom:1px solid #252d35;text-align:left}.toggle{width:40px;height:23px;background:#303945;border-radius:99px;position:relative;cursor:pointer}.toggle:after{content:"";position:absolute;width:17px;height:17px;border-radius:50%;background:#9aa5b0;top:3px;left:3px;transition:.2s}.toggle.on{background:#d9ff3f}.toggle.on:after{left:20px;background:#101306}.audit{margin-top:14px}.log{display:grid;grid-template-columns:110px 1fr 110px;gap:10px;padding:10px 0;border-bottom:1px solid #252d35}.muted{color:#7f8a96}.save,.lang{border:0;background:#d9ff3f;color:#090b0c;padding:10px 14px;border-radius:11px;font-weight:900;cursor:pointer}.lang{background:#171c23;color:#aab3bc;border:1px solid #323b46}.lang.on{background:#d9ff3f;color:#090b0c}.toast{position:fixed;right:20px;bottom:20px;background:#d9ff3f;color:#08100a;padding:11px 14px;border-radius:12px;font-weight:900;transform:translateY(100px);transition:.3s}.toast.on{transform:none}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:14px}.log{grid-template-columns:80px 1fr}.log span:last-child{display:none}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><a class="back" id="back">← Портфолио</a><h1>Auth / RBAC Console</h1><div class="muted" id="subtitle">интерактивная лаба · роли, права, аудит</div></div><div class="top-actions"><button class="save" id="save">Сохранить изменения</button><button class="lang on" id="ru">RU</button><button class="lang" id="en">EN</button></div></div><div class="grid"><aside class="card"><h3 id="usersTitle">Пользователи</h3><div id="users"></div></aside><section><div class="card"><h3 id="title">Права доступа</h3><div class="matrix"><table><thead><tr><th id="resourceH">Ресурс</th><th id="readH">Чтение</th><th id="createH">Создание</th><th id="updateH">Изменение</th><th id="deleteH">Удаление</th></tr></thead><tbody id="matrix"></tbody></table></div></div><div class="card audit"><h3 id="auditTitle">Журнал аудита</h3><div id="audit"></div></div></section></div></div><div class="toast" id="toast">Права сохранены</div><script>const dict={ru:{back:'← Портфолио',subtitle:'интерактивная лаба · роли, права, аудит',save:'Сохранить изменения',usersTitle:'Пользователи',title:'Права доступа',resourceH:'Ресурс',readH:'Чтение',createH:'Создание',updateH:'Изменение',deleteH:'Удаление',auditTitle:'Журнал аудита',toast:'Права сохранены',resources:['Пользователи','Документы','Отчёты','Интеграции','Биллинг'],roles:['Администратор','Оператор','Аналитик','Разработчик'],audit:[['12:42','Роль изменена: Оператор → Администратор','M. Fedrunov'],['11:18','Право Integration/Delete отозвано','system'],['09:06','Вход с нового устройства','Anna Petrova']]},en:{back:'← Portfolio',subtitle:'interactive lab · roles, permissions, audit',save:'Save changes',usersTitle:'Users',title:'Permissions',resourceH:'Resource',readH:'Read',createH:'Create',updateH:'Update',deleteH:'Delete',auditTitle:'Audit trail',toast:'Permissions saved',resources:['Users','Documents','Reports','Integrations','Billing'],roles:['Admin','Operator','Analyst','Developer'],audit:[['12:42','Role changed: Operator → Admin','M. Fedrunov'],['11:18','Integration/Delete revoked','system'],['09:06','Login from new device','Anna Petrova']]}};const us=[['Anna Petrova','Product Ops'],['Mark Wilson','Support'],['Mia Chen','Finance'],['Leo Adams','Engineering']];let current=0,lang='ru';function toggle(el){el.classList.toggle('on')}function renderUsers(){const d=dict[lang];users.innerHTML=us.map((u,i)=>`<div class="user ${i===current?'on':''}" onclick="current=${i};renderUsers();renderMatrix()"><div><b>${u[0]}</b><small>${u[1]}</small></div><span class="role">${d.roles[i]}</span></div>`).join('')}function renderMatrix(){const d=dict[lang];title.textContent=`${d.title} · ${us[current][0]}`;matrix.innerHTML=d.resources.map((r,i)=>`<tr><th>${r}</th>${[0,1,2,3].map((_,j)=>`<td><div class="toggle ${(current===0||j<2||(current===3&&i===3))?'on':''}" onclick="toggle(this)"></div></td>`).join('')}</tr>`).join('')}function renderAudit(){audit.innerHTML=dict[lang].audit.map(x=>`<div class="log"><span class="muted">${x[0]}</span><b>${x[1]}</b><span class="muted">${x[2]}</span></div>`).join('')}function setLang(l){lang=l;localStorage.setItem('mf-sw-lang',l);document.documentElement.lang=l;const d=dict[l];for(const id of ['back','subtitle','save','usersTitle','resourceH','readH','createH','updateH','deleteH','auditTitle'])document.getElementById(id).textContent=d[id];toast.textContent=d.toast;ru.classList.toggle('on',l==='ru');en.classList.toggle('on',l==='en');renderUsers();renderMatrix();renderAudit()}save.onclick=()=>{toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),1600)};back.onclick=()=>location.href='../?lang='+lang;ru.onclick=()=>setLang('ru');en.onclick=()=>setLang('en');const q=new URLSearchParams(location.search).get('lang')||localStorage.getItem('mf-sw-lang')||'ru';setLang(q==='en'?'en':'ru');</script></body></html>

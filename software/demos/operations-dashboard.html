<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operations Dashboard — Demo</title><style>*{box-sizing:border-box}body{margin:0;background:#07090c;color:#eef2f4;font:14px/1.5 Inter,system-ui}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{border-right:1px solid #26303a;background:#0d1116;padding:20px;position:sticky;top:0;height:100vh}.brand{font-size:21px;font-weight:900}.brand b{color:#d9ff3f}.side small{color:#71808d}.nav{margin-top:28px;display:grid;gap:7px}.nav button{border:0;text-align:left;background:none;color:#8d99a5;padding:10px;border-radius:10px}.nav button.on{background:#182019;color:#eaffaa}.main{padding:25px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.env{display:flex;gap:6px;flex-wrap:wrap}.env button,.run{border:1px solid #323d48;background:#11161c;color:#cbd3da;padding:9px 11px;border-radius:10px;cursor:pointer}.env button.on,.run{background:#d9ff3f;color:#091006;border-color:#d9ff3f;font-weight:900}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}.card{border:1px solid #28323c;background:#0f141a;border-radius:18px;padding:16px}.metric strong{font-size:31px;display:block}.metric span,.muted{color:#81909d}.ok{color:#7fffd4}.warn{color:#ffcf5a}.two{display:grid;grid-template-columns:1.2fr .8fr;gap:12px;margin-top:12px}.services,.feed{display:grid;gap:8px}.svc{display:grid;grid-template-columns:1fr 90px 90px 75px;gap:10px;align-items:center;padding:12px;border:1px solid #27313b;border-radius:13px}.event{padding:11px;border-left:2px solid #44515e;background:#0b0f14;border-radius:0 10px 10px 0}.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7fffd4;box-shadow:0 0 16px #7fffd4;animation:p 1.4s infinite}@keyframes p{50%{opacity:.35;transform:scale(.7)}}@media(max-width:850px){.app{grid-template-columns:1fr}.side{height:auto;position:relative;border-right:0;border-bottom:1px solid #26303a}.nav{display:flex;overflow:auto}.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}@media(max-width:520px){.main{padding:14px}.grid{grid-template-columns:1fr}.svc{grid-template-columns:1fr 80px}.svc span:nth-child(3),.svc span:nth-child(4){display:none}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="app"><aside class="side"><div class="brand">OPS<b>/LIVE</b></div><small>portfolio engineering demo</small><div class="nav"><button class="on">Overview</button><button>Services</button><button>Queues</button><button>Incidents</button><button onclick="location.href='../'">← Portfolio</button></div></aside><main class="main"><div class="top"><div><small class="muted">environment status</small><h1>Operations Dashboard</h1></div><div class="env"><button class="on">PROD</button><button>STAGE</button><button>DEV</button><button class="run" id="refresh">Run health check</button></div></div><div class="grid"><div class="card metric"><span>Availability</span><strong class="ok">99.98%</strong><span>last 24h</span></div><div class="card metric"><span>Queue depth</span><strong id="queue">184</strong><span>events</span></div><div class="card metric"><span>p95 latency</span><strong id="latency">243ms</strong><span>API gateway</span></div><div class="card metric"><span>Open incidents</span><strong class="warn">2</strong><span>1 needs review</span></div></div><div class="two"><section class="card"><h3><span class="pulse"></span> Service health</h3><div class="services" id="services"></div></section><section class="card"><h3>Incident feed</h3><div class="feed" id="feed"></div></section></div></main></div><script>const data=[['auth-service','healthy','82ms','0.2%'],['integration-worker','degraded','428ms','2.1%'],['document-api','healthy','119ms','0.4%'],['event-consumer','healthy','74ms','0.1%'],['reporting-service','healthy','164ms','0.7%']];function render(){services.innerHTML=data.map(x=>`<div class="svc"><b>${x[0]}</b><span class="${x[1]=='healthy'?'ok':'warn'}">${x[1]}</span><span>${x[2]}</span><span>${x[3]}</span></div>`).join('');feed.innerHTML=['Retry spike in integration-worker','Queue recovered after consumer restart','Auth token refresh latency normal'].map((x,i)=>`<div class="event"><b>${x}</b><div class="muted">${i?12+i*7:3} min ago</div></div>`).join('')}render();document.querySelectorAll('.env button:not(.run)').forEach(b=>b.onclick=()=>{document.querySelectorAll('.env button:not(.run)').forEach(x=>x.classList.remove('on'));b.classList.add('on')});refresh.onclick=()=>{refresh.textContent='Checking…';setTimeout(()=>{queue.textContent=Math.floor(120+Math.random()*110);latency.textContent=Math.floor(180+Math.random()*120)+'ms';data[1][1]=Math.random()>.45?'healthy':'degraded';data[1][2]=Math.floor(180+Math.random()*250)+'ms';render();refresh.textContent='Run health check'},650)}</script></body></html>

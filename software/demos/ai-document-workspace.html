<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Document Workspace — Demo</title><style>*{box-sizing:border-box}body{margin:0;background:#080a0d;color:#f2f4f6;font:14px/1.5 Inter,system-ui}.wrap{max-width:1220px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center}.back{color:#8d99a5}.run{border:0;background:#d9ff3f;color:#071008;border-radius:11px;padding:10px 14px;font-weight:900;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.card{border:1px solid #29323c;background:#10141a;border-radius:20px;padding:17px}.doc{min-height:520px}.doc textarea{width:100%;min-height:440px;resize:vertical;background:#0a0e13;border:1px solid #2a333d;border-radius:14px;color:#dce2e7;padding:15px;font:14px/1.65 ui-monospace,monospace}.fields{display:grid;gap:9px}.field{display:grid;grid-template-columns:150px 1fr 80px;gap:9px;align-items:center;padding:11px;border:1px solid #28323c;border-radius:13px}.field input{width:100%;background:#090d11;border:1px solid #313b46;border-radius:9px;color:#fff;padding:9px}.conf{color:#7fffd4;font-weight:800}.low{color:#ffce57}.status{display:flex;gap:8px;align-items:center;color:#92a0ad}.dot{width:8px;height:8px;border-radius:50%;background:#7fffd4;box-shadow:0 0 14px #7fffd4}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.json{white-space:pre-wrap;background:#090d11;border:1px solid #28323c;border-radius:13px;padding:13px;color:#aeb9c4;font:12px/1.6 ui-monospace,monospace;margin-top:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}.wrap{padding:13px}.field{grid-template-columns:110px 1fr}.conf{display:none}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><a class="back" href="../">← portfolio</a><h1>AI Document Workspace</h1><div class="status"><i class="dot"></i> human-in-the-loop demo</div></div><button class="run" id="extract">Extract fields</button></div><div class="grid"><section class="card doc"><div class="toolbar"><b>Source document</b><span class="back">plain text</span></div><textarea id="src">INVOICE #INV-2048
Vendor: Northwind Systems Ltd.
Date: 2026-08-16
Currency: EUR
Total: 4,850.00

Services:
- Integration development
- Monitoring setup
- Support package

Payment terms: Net 14
Contact: ops@northwind.example</textarea></section><section class="card"><div class="toolbar"><b>Structured result</b><span id="state" class="back">ready</span></div><div class="fields" id="fields"></div><div class="json" id="json"></div></section></div></div><script>const base=[['Invoice','INV-2048',.99],['Vendor','Northwind Systems Ltd.',.96],['Date','2026-08-16',.98],['Currency','EUR',.99],['Total','4,850.00',.92],['Terms','Net 14',.81]];function render(){fields.innerHTML=base.map(x=>`<div class="field"><b>${x[0]}</b><input value="${x[1]}"><span class="${x[2]>.9?'conf':'low'}">${Math.round(x[2]*100)}%</span></div>`).join('');json.textContent=JSON.stringify(Object.fromEntries(base.map(x=>[x[0].toLowerCase(),x[1]])),null,2)}render();extract.onclick=()=>{state.textContent='extracting…';extract.disabled=true;setTimeout(()=>{state.textContent='review required';extract.disabled=false;render()},850)}</script></body></html>
